name: CI — Python Unit Tests & R Cross-Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-and-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up R and competing-risks packages
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R survival, cmprsk, jsonlite
        run: |
          Rscript -e "install.packages(c('survival', 'cmprsk', 'jsonlite'), repos='https://cloud.r-project.org')"

      - name: Run full pytest suite (including Python vs R cross-validation)
        run: |
          pytest --cov=proteostasis_sim --cov-report=term-missing
