name: Bug Report
description: Report a numerical issue, crash, or discrepancy in proteostasis-sim
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please provide enough detail so we can reproduce it cleanly.
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: Clear description of what happened vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps / Minimal Code to Reproduce
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      value: |
        - OS:
        - Python version:
        - proteostasis-sim version / commit:
        - R version (if applicable):
    validations:
      required: true
