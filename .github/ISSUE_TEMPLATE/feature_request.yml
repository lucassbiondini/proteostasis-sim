name: Feature Request / Model Extension
description: Suggest a new biological mechanism, biostatistical estimator, or GEO dataset integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Scientific or Computational Motivation
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design / Mathematical Formulation
      description: Describe the proposed API, equations, or validation criteria.
    validations:
      required: true
